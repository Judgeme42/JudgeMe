services:
  - type: web
    name: judgeme-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d

  - type: web
    name: judgeme-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BACKEND_URL
        sync: false
