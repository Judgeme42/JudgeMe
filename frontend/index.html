<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FCA UACH · Reportes académicos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/webp" href="favicon.webp" />
  </head>
  <body>
    <!-- Pantalla de autenticación -->
    <div id="auth-screen" class="auth-screen">
      <div class="auth-container">
        <div class="auth-header">
          <div class="auth-logos">
            <img src="Escudo_uach.jpg" alt="Logo UACH" class="auth-brand-mark" />
            <div class="auth-divider"></div>
            <img src="images.jpg" alt="Facultad FCA" class="auth-faculty-mark" />
          </div>
          <h1>JudgeMe</h1>
        </div>

        <!-- Login Screen -->
        <div id="login-screen" class="auth-screen-content">
          <form id="login-form" class="auth-form">
            <h2>Iniciar Sesión</h2>
            <p class="auth-description">Ingresa con tu correo institucional y contraseña</p>

            <label>
              Correo Institucional
              <input type="email" name="email" required placeholder="tu.correo@uach.mx" />
            </label>

            <label>
              Contraseña
              <input type="password" name="password" required placeholder="Tu contraseña" />
            </label>

            <button type="submit" class="btn btn-primary btn-full">Iniciar Sesión</button>

            <div class="auth-switch">
              <p>¿No tienes cuenta?</p>
              <button type="button" class="auth-link" id="show-register">Crear cuenta</button>
            </div>
          </form>
        </div>

        <!-- Register Screen -->
        <div id="register-screen" class="auth-screen-content" hidden>
          <form id="register-form" class="auth-form">
            <h2>Registrarse</h2>
            <p class="auth-description">Crea tu cuenta como estudiante</p>

            <label>
              Número de Matrícula
              <input type="text" name="studentNumber" required placeholder="Ej: 2024001" />
            </label>

            <label>
              Correo Institucional
              <input type="email" name="email" required placeholder="tu.correo@uach.mx" />
            </label>

            <label>
              Contraseña
              <input type="password" name="password" required placeholder="Mínimo 8 caracteres" />
            </label>

            <label>
              Confirmar Contraseña
              <input type="password" name="confirmPassword" required placeholder="Repite tu contraseña" />
            </label>

            <button type="submit" class="btn btn-primary btn-full">Crear Cuenta</button>

            <div class="auth-switch">
              <p>¿Ya tienes cuenta?</p>
              <button type="button" class="auth-link" id="show-login">Iniciar sesión</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden role="status"></div>

    <script type="module" src="script.js"></script>
  </body>
</html>
